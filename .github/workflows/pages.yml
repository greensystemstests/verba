# Publishes the static pages (services, privacy, terms) to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy static pages

on:
  push:
    branches: [main, claude/zen-albattani-t7401e]
    paths:
      - 'app/services/**'
      - 'app/privacy/**'
      - 'app/terms/**'
      - 'app/globals.css'
      - 'components/verba-ui.tsx'
      - 'components/ui/**'
      - 'lib/links.ts'
      - 'lib/catalog.ts'
      - 'vendor/**'
      - 'public/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/check-pages.mjs'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Repository variables (Settings -> Secrets and variables -> Actions -> Variables):
      #   PAGES_CUSTOM_DOMAIN  set when the site is served from your own domain at its root
      #   PAGES_APP_ORIGIN     origin of the app, e.g. https://app.example.com
      - name: Choose base path and app origin
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          APP_ORIGIN: ${{ vars.PAGES_APP_ORIGIN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"; else echo "PAGES_BASE_PATH=/$REPO_NAME" >> "$GITHUB_ENV"; fi
          echo "PAGES_APP_ORIGIN=${APP_ORIGIN:-https://verba-x863.onrender.com}" >> "$GITHUB_ENV"
      - name: Build and check the static site
        run: npm run build:pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
