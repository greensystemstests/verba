services:
  - type: web
    name: verba
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/auth/status
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
