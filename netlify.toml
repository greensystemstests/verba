# Netlify build settings. Secrets (DATABASE_URL, DEEPL_API_KEY) are set in the
# Netlify site's environment variables, never in this file.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  # Test helpers only mention setting names (e.g. TEST_DATABASE_URL) and a local example address;
  # they hold no secrets and are never part of the site, so the secrets scan skips them.
  SECRETS_SCAN_OMIT_PATHS = "tests/**,scripts/run-tests.mjs"
